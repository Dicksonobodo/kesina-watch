<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dixon Watch: every movie, zero ads</title>
    <meta name="description" content="Paste a movie link. Watch or download it with no ads, no pop-ups and no fake download buttons." />
    <meta name="theme-color" content="#07070A" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dixon Watch" />

    <!-- Link previews (WhatsApp, X, Facebook, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dixon Watch" />
    <meta property="og:title" content="Dixon Watch: every movie, zero ads" />
    <meta property="og:description" content="Paste a link. Watch or download it. No pop-ups, no fake buttons." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; color: #f3f3f6; background: #07070a; padding: 2rem">Dixon Watch needs JavaScript turned on.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# Dixon Watch detection server + Caddy (automatic HTTPS) for an Oracle Cloud / any Linux VM.
# Started by setup.sh; afterwards: `docker compose up -d --build` to update, `docker compose logs -f server` for logs.
services:
  server:
    build: ../server
    env_file: server.env
    environment:
      PORT: "8787"
      TRUST_PROXY: "true"
      PUBLIC_URL: "https://${DOMAIN}"
    restart: unless-stopped
    shm_size: "1gb" # Chromium needs more shared memory than Docker's 64 MB default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
